[project]
name = "agent-messaging-mcp"
version = "0.1.0"
description = "Shared MCP server for Hermes and Claw to operate WhatsApp Web and Telegram Web through Selenium."
requires-python = ">=3.10"
dependencies = [
  "mcp>=1.0.0",
  "selenium>=4.18.0",
  "psycopg[binary]>=3.1.0",
]

[project.scripts]
agent-messaging-mcp = "agent_messaging_mcp.server:main"
agent-messaging = "agent_messaging_mcp.cli:main"
agent-messaging-call = "agent_messaging_mcp.mcp_call:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
